[settings]
experimental = true
auto_install = true

[settings.python]
github_attestations = false

[tools]
python = ["3.10", "3.8"]
uv = "latest"
ruby = "3.2"
node = "lts-gallium"

[env]
PIPENV_VENV_IN_PROJECT = "1"
FLASK_APP = "app.py"
FLASK_DEBUG = "1"

[tasks."setup:web-python"]
description = "Setup web_full_stack/python (Flask + Pipenv)"
run = """
pip install 'pipenv==2024.4.0'
cd web_full_stack/python && rm -rf .venv Pipfile.lock && pipenv install
"""

[tasks."setup:web-js"]
description = "Setup web_full_stack/js (React + CRA)"
run = "cd web_full_stack/js && rm -rf node_modules && npm install"

[tasks."setup:web-ruby"]
description = "Setup web_full_stack/ruby (Rails)"
run = "cd web_full_stack/ruby && rm -rf vendor/bundle && bundle install"

[tasks."setup:data"]
description = "Setup data/python challenge (uv + Python 3.10+)"
run = "cd data/python && rm -rf .venv && uv sync"

[tasks.setup]
description = "Setup all interview tracks"
depends = ["setup:web-python", "setup:web-js", "setup:web-ruby", "setup:data"]

[tasks."run:web-python"]
description = "Run Flask dev server"
run = "cd web_full_stack/python && pipenv run flask run --reload"
